    description: Deactivate the user with the given uuid. Please note that users can't
      be deleted since they are needed to construct creator/editor information.
    get:
      description: Read the user with the given uuid
      parameters:
      - name: etag
        in: query
        description: Parameter which can be used to disable the etag parameter generation
          and thus increase performance when etags are not needed.
        required: false
        schema:
          type: boolean
          description: Parameter which can be used to disable the etag parameter generation
            and thus increase performance when etags are not needed.
          default: "true"
      - name: role
        in: query
        description: |-
          The _role_ query parameter take a UUID of a role and may be used to add permission information to the response via the _rolePerm_ property which lists the permissions for the specified role on the element.
          This may be useful when you are logged in as admin but you want to retrieve the editor role permissions on a given node.
          Endpoint: */api/v2/:projectName/nodes?role=:roleUuid*
        required: false
        schema:
          type: string
          description: |-
            The _role_ query parameter take a UUID of a role and may be used to add permission information to the response via the _rolePerm_ property which lists the permissions for the specified role on the element.
            This may be useful when you are logged in as admin but you want to retrieve the editor role permissions on a given node.
            Endpoint: */api/v2/:projectName/nodes?role=:roleUuid*
          example: 24cf92691c7641158f92691c76c115ef
      - name: lang
        in: query
        description: ISO 639-1 language tag of the language which should be loaded.
          Fallback handling can be applied by specifying multiple languages in a comma-separated
          list. The first matching language will be returned.  If omitted or the requested
          language is not available then the _defaultLanguage_ as configured in _mesh.yml_
          will be returned.
        required: false
        schema:
          type: string
          description: ISO 639-1 language tag of the language which should be loaded.
            Fallback handling can be applied by specifying multiple languages in a
            comma-separated list. The first matching language will be returned.  If
            omitted or the requested language is not available then the _defaultLanguage_
            as configured in _mesh.yml_ will be returned.
          example: "en,de"
