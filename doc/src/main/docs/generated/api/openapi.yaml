  /api/v2/admin/consistency/check:
    description: "Invokes a consistency check of the graph database without attempting\
      \ to repairing the found issues. A list of found issues will be returned. When\
      \ an `async=true` query parameter is used, a new consistency check Job is queued,\
      \ and the check results should be obtained with the call to the link:#admin_jobs__jobUuid__get[corresponding\
      \ job].Please note that some checks do require an `async` flag set."
    get:
      description: "Invokes a consistency check of the graph database without attempting\
        \ to repairing the found issues. A list of found issues will be returned.\
        \ When an `async=true` query parameter is used, a new consistency check Job\
        \ is queued, and the check results should be obtained with the call to the\
        \ link:#admin_jobs__jobUuid__get[corresponding job].Please note that some\
        \ checks do require an `async` flag set."
      parameters:
      - name: async
        in: query
        description: Specifiy whether the consistency check should be executed asynchronously
          (as job). *Please note that some checks do require this flag set!*
        required: false
        schema:
          type: boolean
          description: Specifiy whether the consistency check should be executed asynchronously
            (as job). *Please note that some checks do require this flag set!*
          example: "true"
          default: "false"
      responses:
        default:
          description: application/json
          content:
            application/json: {}
        "200":
          description: Consistency check report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsistencyCheckResponse"
              example:
                outputTruncated: false
                result: INCONSISTENT
                repairCount: {}
                inconsistencies:
                - description: A dangling field container has been found.
                  severity: LOW
                  elementUuid: c5ac82fa1a9c43b6ac82fa1a9ca3b61c
                  repaired: false
                  repairAction: DELETE
      security:
      - bearerAuth: []
  /api/v2/admin/consistency/repair:
    description: "Invokes a consistency check and repair of the graph database and\
      \ returns a list of found issues and their state. When an `async=true` query\
      \ parameter is used, a new consistency repair Job is queued, and the repair\
      \ results should be obtained with the call to the link:#admin_jobs__jobUuid__get[corresponding\
      \ job]. Please note that some repairs do require an `async` flag set."
    post:
      description: "Invokes a consistency check and repair of the graph database and\
        \ returns a list of found issues and their state. When an `async=true` query\
        \ parameter is used, a new consistency repair Job is queued, and the repair\
        \ results should be obtained with the call to the link:#admin_jobs__jobUuid__get[corresponding\
        \ job]. Please note that some repairs do require an `async` flag set."
      parameters:
      - name: async
        in: query
        description: Specifiy whether the consistency check should be executed asynchronously
          (as job). *Please note that some checks do require this flag set!*
        required: false
        schema:
          type: boolean
          description: Specifiy whether the consistency check should be executed asynchronously
            (as job). *Please note that some checks do require this flag set!*
          example: "true"
          default: "false"
      responses:
        default:
          description: application/json
          content:
            application/json: {}
        "200":
          description: Consistency check and repair report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsistencyCheckResponse"
              example:
                outputTruncated: false
                result: INCONSISTENT
                repairCount: {}
                inconsistencies:
                - description: A dangling field container has been found.
                  severity: LOW
                  elementUuid: c5ac82fa1a9c43b6ac82fa1a9ca3b61c
                  repaired: true
                  repairAction: DELETE
      security:
      - bearerAuth: []
