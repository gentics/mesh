  /api/v2/roles/:
    description: Load multiple roles and return a paged list response
    get:
      description: Load multiple roles and return a paged list response
      parameters:
      - name: sortBy
        in: query
        description: Field name to sort the result by.
        required: false
        schema:
          type: string
          description: Field name to sort the result by.
          example: name
      - name: etag
        in: query
        description: Parameter which can be used to disable the etag parameter generation
          and thus increase performance when etags are not needed.
        required: false
        schema:
          type: boolean
          description: Parameter which can be used to disable the etag parameter generation
            and thus increase performance when etags are not needed.
          default: "true"
      - name: page
        in: query
        description: Number of page to be loaded.
        required: false
        schema:
          type: number
          description: Number of page to be loaded.
          format: double
          example: "42"
          default: "1"
      - name: perPage
        in: query
        description: Number of elements per page.
        required: false
        schema:
          type: number
          description: Number of elements per page.
          format: double
          example: "42"
      - name: fields
        in: query
        description: Limit the output to certain fields. This is useful in order to
          reduce the response JSON overhead.
        required: false
        schema:
          type: string
          description: Limit the output to certain fields. This is useful in order
            to reduce the response JSON overhead.
          example: "uuid,name"
          default: ""
      - name: order
        in: query
        description: Field order (ASC/DESC) to sort the result by.
        required: false
        schema:
          type: string
          description: Field order (ASC/DESC) to sort the result by.
