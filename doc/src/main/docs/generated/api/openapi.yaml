  /api/v2/projects/:
    description: Load multiple projects and return a paged response.
    get:
      description: Load multiple projects and return a paged response.
      parameters:
      - name: sortBy
        in: query
        description: Field name to sort the result by.
        required: false
        schema:
          type: string
          description: Field name to sort the result by.
          example: name
      - name: page
        in: query
        description: Number of page to be loaded.
        required: false
        schema:
          type: number
          description: Number of page to be loaded.
          format: double
          example: "42"
          default: "1"
      - name: perPage
        in: query
        description: Number of elements per page.
        required: false
        schema:
          type: number
          description: Number of elements per page.
          format: double
          example: "42"
      - name: role
        in: query
        description: |-
          The _role_ query parameter take a UUID of a role and may be used to add permission information to the response via the _rolePerm_ property which lists the permissions for the specified role on the element.
          This may be useful when you are logged in as admin but you want to retrieve the editor role permissions on a given node.
          Endpoint: */api/v2/:projectName/nodes?role=:roleUuid*
        required: false
        schema:
          type: string
          description: |-
            The _role_ query parameter take a UUID of a role and may be used to add permission information to the response via the _rolePerm_ property which lists the permissions for the specified role on the element.
            This may be useful when you are logged in as admin but you want to retrieve the editor role permissions on a given node.
            Endpoint: */api/v2/:projectName/nodes?role=:roleUuid*
          example: 24cf92691c7641158f92691c76c115ef
      - name: order
        in: query
        description: Field order (ASC/DESC) to sort the result by.
        required: false
        schema:
          type: string
          description: Field order (ASC/DESC) to sort the result by.
          example: ASCENDING
          enum:
          - asc
          - desc
      responses:
        default:
          description: application/json
          content:
            application/json: {}
