          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageVariantsResponse"
              example:
                variants:
                - width: 500
                  height: 100
                  origin: true
                  auto: false
                - rect:
                    startX: 10
                    startY: 10
                    width: 20
                    height: 20
                  cropMode: RECT
                  origin: false
                  auto: false
                - height: 50
                  origin: false
                  auto: false
