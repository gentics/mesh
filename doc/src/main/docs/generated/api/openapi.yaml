            example: |-
              {
                "variants" : [ {
                  "width" : "auto",
                  "height" : "100",
                  "resizeMode" : "SMART",
                  "cacheKey" : "resizeSMARTrwautorh100"
                }, {
                  "resizeMode" : "SMART",
                  "focalPoint" : {
                    "x" : 0.3,
                    "y" : 0.3
                  },
                  "focalZoom" : 0.6,
                  "focalPointZoom" : 0.6,
                  "cacheKey" : "resizeSMARTfp0.3-0.3fpz0.6"
                } ],
                "deleteOther" : false
              }
      responses:
        "200":
          description: JSON for a variants of the binary field of the node for the
