  /api/v2/microschemas/{microschemaUuid}/diff:
    description: Compare the provided schema with the schema which is currently stored
      and generate a set of changes that have been detected.
    post:
      description: Compare the provided schema with the schema which is currently
        stored and generate a set of changes that have been detected.
      parameters:
      - name: microschemaUuid
        in: path
        description: Uuid of the microschema.
        required: true
        schema:
          type: string
          description: Uuid of the microschema.
          example: 2715307deafc4ecc95307deafccecc10
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MicroschemaCreateRequest"
            example: |-
              {
                "description" : "Microschema for Geolocations",
                "name" : "geolocation",
                "fields" : [ {
                  "name" : "longitude",
                  "label" : "Longitude",
                  "required" : true,
                  "noIndex" : false,
                  "type" : "number"
                }, {
                  "name" : "latitude",
                  "label" : "Latitude",
                  "required" : true,
                  "noIndex" : false,
                  "type" : "number"
                } ],
                "microschema" : true
              }
      responses:
        default:
          description: application/json
          content:
            application/json: {}
        "200":
          description: Found difference between both microschemas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaChangesListModel"
              example:
                changes:
                - operation: ADDFIELD
                  properties:
                    field: listFieldToBeAddedField
                    elasticsearch: "{\"key\":\"value\"}"
                    label: Field Label Value
                    type: list
                    listType: html
                - operation: CHANGEFIELDTYPE
                  properties:
                    field: fieldToBeUpdated
                    type: string
                - operation: REMOVEFIELD
                  properties:
                    field: fieldToBeRemoved
                - operation: UPDATEFIELD
                  properties:
                    field: fieldToBeUpdated
                    displayFieldname: newDisplayField
                    label: newLabel
                - operation: UPDATESCHEMA
                  properties: {}
      security:
      - bearerAuth: []
