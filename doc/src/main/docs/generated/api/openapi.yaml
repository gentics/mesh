openapi: 3.0.1
info:
  title: Gentics Mesh REST API
  version: 3.3.0
servers: []
paths:
  /api/v2/schemas/{schemaUuid}:
    description: Delete the schema with the given uuid.
    get:
      description: Load the schema with the given uuid.
      parameters:
      - name: fields
        in: query
        description: Limit the output to certain fields. This is useful in order to
          reduce the response JSON overhead.
        required: false
        schema:
          type: string
          description: Limit the output to certain fields. This is useful in order
            to reduce the response JSON overhead.
          example: "uuid,name"
          default: ""
      - name: version
        in: query
        description: "Specifies the version to be loaded. Can either be published/draft\
          \ or version number. e.g.: _0.1_, _1.0_, _draft_, _published_."
        required: false
        schema:
          type: string
          description: "Specifies the version to be loaded. Can either be published/draft\
            \ or version number. e.g.: _0.1_, _1.0_, _draft_, _published_."
          example: "1.1"
          default: draft
      - name: etag
        in: query
        description: Parameter which can be used to disable the etag parameter generation
          and thus increase performance when etags are not needed.
        required: false
        schema:
          type: boolean
          description: Parameter which can be used to disable the etag parameter generation
            and thus increase performance when etags are not needed.
          default: "true"
      - name: schemaUuid
        in: path
        description: Uuid of the schema.
        required: true
        schema:
          type: string
          description: Uuid of the schema.
          example: 2aa83a2b3cba40a1a83a2b3cba90a1de
      responses:
        default:
          description: application/json
          content:
            application/json: {}
        "200":
          description: Loaded schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaResponse"
              example:
                uuid: c5ac82fa1a9c43b6ac82fa1a9ca3b61c
                displayField: name
                segmentField: name
                container: false
                description: Example schema description
                name: ExampleSchema
                fields:
                - name: name
                  label: Name
                  required: false
                  noIndex: false
                  type: string
                - name: number
                  label: Number
                  required: false
                  noIndex: false
                  type: number
                - name: html
                  label: Teaser
                  required: false
                  noIndex: false
                  type: html
                - name: list
                  label: List of nodes
                  required: false
                  noIndex: false
                  listType: node
                  type: list
                  allow:
                  - content
                  - video
                - name: node
                  required: false
                  noIndex: false
                  type: node
                  allow:
                  - content
                  - video
                  - image
                - name: location
                  label: Location
                  required: false
                  noIndex: false
                  type: micronode
                  allow:
                  - geolocation
                - name: locationlist
                  label: List of Locations
                  required: false
                  noIndex: false
                  listType: micronode
                  type: list
                  allow:
                  - geolocation
                noIndex: false
                microschema: false
                permissions:
                  create: true
                  read: true
                  update: true
                  delete: true
                  publish: false
                  readPublished: false
      security:
      - bearerAuth: []
    post:
      description: Update or create the schema.
      parameters:
      - name: updateAssignedBranches
        in: query
        description: Update the schema version for all branches which already utilize
          the schema.
        required: false
        schema:
          type: boolean
          description: Update the schema version for all branches which already utilize
            the schema.
          default: "true"
      - name: updateBranchNames
        in: query
        description: List of branch names which should be included in the update process.
          By default all branches which use the schema will be updated. You can thus
          use this parameter to only include a subset of branch in the update.
        required: false
        schema:
          type: string
          description: List of branch names which should be included in the update
            process. By default all branches which use the schema will be updated.
            You can thus use this parameter to only include a subset of branch in
            the update.
          example: "summerBranch,winterBranch"
      - name: strictValidation
        in: query
        description: "Validate the Elasticsearch settings in the schema. When this\
          \ parameter is set, a schema update or creation will fail, when the respective\
          \ Elasticsearch index cannot be created."
        required: false
        schema:
          type: boolean
          description: "Validate the Elasticsearch settings in the schema. When this\
            \ parameter is set, a schema update or creation will fail, when the respective\
            \ Elasticsearch index cannot be created."
          default: "false"
      - name: schemaUuid
        in: path
        description: Uuid of the schema.
        required: true
        schema:
          type: string
          description: Uuid of the schema.
          example: 2aa83a2b3cba40a1a83a2b3cba90a1de
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaUpdateRequest"
            example: |-
              {
                "description" : "New description",
                "name" : "extended-content",
                "fields" : [ ],
                "microschema" : false
              }
      responses:
        default:
          description: application/json
          content:
            application/json: {}
        "200":
          description: Updated or new schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaResponse"
              example:
                uuid: c5ac82fa1a9c43b6ac82fa1a9ca3b61c
                displayField: name
                segmentField: name
                container: false
                description: Example schema description
                name: ExampleSchema
                fields:
                - name: name
                  label: Name
                  required: false
                  noIndex: false
                  type: string
                - name: number
                  label: Number
                  required: false
                  noIndex: false
                  type: number
                - name: html
                  label: Teaser
                  required: false
                  noIndex: false
                  type: html
                - name: list
                  label: List of nodes
                  required: false
                  noIndex: false
                  listType: node
                  type: list
                  allow:
                  - content
                  - video
                - name: node
                  required: false
                  noIndex: false
                  type: node
                  allow:
                  - content
                  - video
                  - image
                - name: location
                  label: Location
                  required: false
                  noIndex: false
                  type: micronode
                  allow:
                  - geolocation
                - name: locationlist
                  label: List of Locations
                  required: false
                  noIndex: false
                  listType: micronode
                  type: list
                  allow:
                  - geolocation
                noIndex: false
                microschema: false
                permissions:
                  create: true
                  read: true
                  update: true
                  delete: true
                  publish: false
                  readPublished: false
      security:
      - bearerAuth: []
    delete:
      description: Delete the schema with the given uuid.
      parameters:
      - name: schemaUuid
        in: path
        description: Uuid of the schema.
        required: true
        schema:
          type: string
          description: Uuid of the schema.
          example: 2aa83a2b3cba40a1a83a2b3cba90a1de
      responses:
        default:
          description: application/json
          content:
            application/json: {}
        "204":
          description: Schema was successfully deleted.
      security:
      - bearerAuth: []
  /api/v2/schemas/:
    description: Create a new schema.
    get:
      description: Read multiple schemas and return a paged list response.
      parameters:
      - name: sortBy
        in: query
        description: Field name to sort the result by.
        required: false
        schema:
          type: string
          description: Field name to sort the result by.
          example: name
      - name: etag
        in: query
        description: Parameter which can be used to disable the etag parameter generation
          and thus increase performance when etags are not needed.
        required: false
        schema:
          type: boolean
          description: Parameter which can be used to disable the etag parameter generation
            and thus increase performance when etags are not needed.
          default: "true"
      - name: page
        in: query
        description: Number of page to be loaded.
        required: false
        schema:
          type: number
          description: Number of page to be loaded.
          format: double
          example: "42"
          default: "1"
      - name: perPage
        in: query
        description: Number of elements per page.
        required: false
        schema:
          type: number
          description: Number of elements per page.
          format: double
          example: "42"
      - name: fields
        in: query
        description: Limit the output to certain fields. This is useful in order to
          reduce the response JSON overhead.
        required: false
        schema:
          type: string
          description: Limit the output to certain fields. This is useful in order
            to reduce the response JSON overhead.
          example: "uuid,name"
          default: ""
      - name: order
        in: query
        description: Field order (ASC/DESC) to sort the result by.
        required: false
        schema:
          type: string
          description: Field order (ASC/DESC) to sort the result by.
          example: ASCENDING
          enum:
          - asc
          - desc
      responses:
        default:
          description: application/json
          content:
            application/json: {}
        "200":
          description: Loaded list of schemas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaListResponse"
              example:
                data:
                - uuid: c5ac82fa1a9c43b6ac82fa1a9ca3b61c
                  displayField: name
                  segmentField: name
                  container: false
                  description: Example schema description
                  name: ExampleSchema
                  fields:
                  - name: name
                    label: Name
                    required: false
                    noIndex: false
                    type: string
                  - name: number
                    label: Number
                    required: false
                    noIndex: false
                    type: number
                  - name: html
                    label: Teaser
                    required: false
                    noIndex: false
                    type: html
                  - name: list
                    label: List of nodes
                    required: false
                    noIndex: false
                    listType: node
                    type: list
                    allow:
                    - content
                    - video
                  - name: node
                    required: false
                    noIndex: false
                    type: node
                    allow:
                    - content
                    - video
                    - image
                  - name: location
                    label: Location
                    required: false
                    noIndex: false
                    type: micronode
                    allow:
                    - geolocation
                  - name: locationlist
                    label: List of Locations
                    required: false
                    noIndex: false
                    listType: micronode
                    type: list
                    allow:
                    - geolocation
                  noIndex: false
                  microschema: false
                  permissions:
                    create: true
                    read: true
                    update: true
                    delete: true
                    publish: false
                    readPublished: false
                - uuid: c5ac82fa1a9c43b6ac82fa1a9ca3b61c
                  displayField: name
                  segmentField: name
                  container: false
                  description: Example schema description
                  name: ExampleSchema
                  fields:
                  - name: name
                    label: Name
                    required: false
                    noIndex: false
                    type: string
                  - name: number
                    label: Number
                    required: false
                    noIndex: false
                    type: number
                  - name: html
                    label: Teaser
                    required: false
                    noIndex: false
                    type: html
                  - name: list
                    label: List of nodes
                    required: false
                    noIndex: false
                    listType: node
                    type: list
                    allow:
                    - content
                    - video
                  - name: node
                    required: false
                    noIndex: false
                    type: node
                    allow:
                    - content
                    - video
                    - image
                  - name: location
                    label: Location
                    required: false
                    noIndex: false
                    type: micronode
                    allow:
                    - geolocation
                  - name: locationlist
                    label: List of Locations
                    required: false
                    noIndex: false
                    listType: micronode
                    type: list
                    allow:
                    - geolocation
                  noIndex: false
                  microschema: false
                  permissions:
                    create: true
                    read: true
                    update: true
                    delete: true
                    publish: false
                    readPublished: false
                _metainfo:
                  currentPage: 1
                  perPage: 2
                  pageCount: 10
                  totalCount: 20
      security:
      - bearerAuth: []
    post:
      description: Create a new schema.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaCreateRequest"
            example: |-
              {
                "displayField" : "name",
                "segmentField" : "name",
                "container" : true,
                "description" : "Some description text",
                "name" : "video",
                "fields" : [ {
                  "name" : "name",
                  "required" : false,
                  "noIndex" : false,
                  "type" : "string"
                } ],
                "microschema" : false
              }
      responses:
        default:
          description: application/json
          content:
            application/json: {}
        "201":
          description: Created schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaResponse"
              example:
                uuid: c5ac82fa1a9c43b6ac82fa1a9ca3b61c
                displayField: name
                segmentField: name
                container: false
                description: Example schema description
                name: ExampleSchema
                fields:
                - name: name
                  label: Name
                  required: false
                  noIndex: false
                  type: string
                - name: number
                  label: Number
                  required: false
                  noIndex: false
                  type: number
                - name: html
                  label: Teaser
                  required: false
                  noIndex: false
                  type: html
                - name: list
                  label: List of nodes
                  required: false
                  noIndex: false
                  listType: node
                  type: list
                  allow:
                  - content
                  - video
                - name: node
                  required: false
                  noIndex: false
                  type: node
                  allow:
                  - content
                  - video
                  - image
                - name: location
                  label: Location
                  required: false
                  noIndex: false
                  type: micronode
                  allow:
                  - geolocation
                - name: locationlist
                  label: List of Locations
                  required: false
                  noIndex: false
                  listType: micronode
                  type: list
                  allow:
                  - geolocation
                noIndex: false
                microschema: false
                permissions:
                  create: true
                  read: true
                  update: true
                  delete: true
                  publish: false
                  readPublished: false
      security:
      - bearerAuth: []
  /api/v2/schemas/{schemaUuid}/diff:
    description: Compare the given schema with the stored schema and create a changeset.
    post:
      description: Compare the given schema with the stored schema and create a changeset.
      parameters:
      - name: schemaUuid
        in: path
        description: Uuid of the schema.
        required: true
        schema:
          type: string
          description: Uuid of the schema.
          example: 2aa83a2b3cba40a1a83a2b3cba90a1de
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaResponse"
            example: |-
              {
                "uuid" : "c5ac82fa1a9c43b6ac82fa1a9ca3b61c",
                "displayField" : "name",
                "segmentField" : "name",
                "container" : false,
                "description" : "Example schema description",
                "name" : "ExampleSchema",
                "fields" : [ {
                  "name" : "name",
                  "label" : "Name",
                  "required" : false,
                  "noIndex" : false,
                  "type" : "string"
                }, {
                  "name" : "number",
                  "label" : "Number",
                  "required" : false,
                  "noIndex" : false,
                  "type" : "number"
                }, {
                  "name" : "html",
                  "label" : "Teaser",
                  "required" : false,
                  "noIndex" : false,
                  "type" : "html"
                }, {
                  "name" : "list",
                  "label" : "List of nodes",
                  "required" : false,
                  "noIndex" : false,
                  "listType" : "node",
                  "type" : "list",
                  "allow" : [ "content", "video" ]
                }, {
                  "name" : "node",
                  "required" : false,
                  "noIndex" : false,
                  "type" : "node",
                  "allow" : [ "content", "video", "image" ]
                }, {
                  "name" : "location",
                  "label" : "Location",
                  "required" : false,
                  "noIndex" : false,
                  "type" : "micronode",
                  "allow" : [ "geolocation" ]
                }, {
                  "name" : "locationlist",
                  "label" : "List of Locations",
                  "required" : false,
                  "noIndex" : false,
                  "listType" : "micronode",
                  "type" : "list",
                  "allow" : [ "geolocation" ]
                } ],
                "noIndex" : false,
                "microschema" : false,
                "permissions" : {
                  "create" : true,
                  "read" : true,
                  "update" : true,
                  "delete" : true,
                  "publish" : false,
                  "readPublished" : false
                }
              }
      responses:
        default:
          description: application/json
          content:
            application/json: {}
        "200":
          description: List of schema changes that were detected by comparing the
            posted schema and the current version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaChangesListModel"
              example:
                changes:
                - operation: ADDFIELD
                  properties:
                    field: listFieldToBeAddedField
                    elasticsearch: "{\"key\":\"value\"}"
                    label: Field Label Value
                    type: list
                    listType: html
                - operation: CHANGEFIELDTYPE
                  properties:
                    field: fieldToBeUpdated
                    type: string
                - operation: REMOVEFIELD
                  properties:
                    field: fieldToBeRemoved
                - operation: UPDATEFIELD
                  properties:
                    field: fieldToBeUpdated
                    displayFieldname: newDisplayField
                    label: newLabel
                - operation: UPDATESCHEMA
                  properties: {}
      security:
      - bearerAuth: []
  /api/v2/schemas/{schemaUuid}/changes:
    description: Apply the posted changes to the schema. The schema migration will
      not automatically be started.
    post:
      description: Apply the posted changes to the schema. The schema migration will
        not automatically be started.
      parameters:
      - name: schemaUuid
        in: path
        description: Uuid of the schema.
        required: true
        schema:
          type: string
          description: Uuid of the schema.
          example: 2aa83a2b3cba40a1a83a2b3cba90a1de
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaChangesListModel"
            example: |-
              {
                "changes" : [ {
                  "operation" : "ADDFIELD",
                  "properties" : {
                    "field" : "listFieldToBeAddedField",
                    "elasticsearch" : "{\"key\":\"value\"}",
                    "label" : "Field Label Value",
                    "type" : "list",
                    "listType" : "html"
                  }
                }, {
                  "operation" : "CHANGEFIELDTYPE",
                  "properties" : {
                    "field" : "fieldToBeUpdated",
                    "type" : "string"
                  }
                }, {
                  "operation" : "REMOVEFIELD",
                  "properties" : {
                    "field" : "fieldToBeRemoved"
                  }
                }, {
                  "operation" : "UPDATEFIELD",
                  "properties" : {
                    "field" : "fieldToBeUpdated",
                    "displayFieldname" : "newDisplayField",
                    "label" : "newLabel"
                  }
                }, {
                  "operation" : "UPDATESCHEMA",
                  "properties" : { }
                } ]
              }
      responses:
        default:
          description: application/json
          content:
            application/json: {}
        "200":
          description: Schema changes have been applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericMessageResponse"
              example:
                message: I18n message
                internalMessage: null
                properties: null
      security:
      - bearerAuth: []
  /api/v2/schemas/{schemaUuid}/rolePermissions:
    description: Revoke permissions on the schema from multiple roles.
    get:
      description: Get the permissions on the schema for all roles.
      parameters:
      - name: schemaUuid
        in: path
        description: Uuid of the schema
        required: true
        schema:
          type: string
          description: Uuid of the schema
          example: 2aa83a2b3cba40a1a83a2b3cba90a1de
      responses:
        default:
          description: application/json
          content:
            application/json: {}
        "200":
          description: Loaded permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectPermissionResponse"
              example:
                create:
                - name: editor
                  uuid: 01ed2f8647421b2b85891e5204d53f1b
                read:
                - name: translator
                  uuid: d84a6f054a3f4ed68a6f054a3f1ed635
                - name: editor
                  uuid: 01ed2f8647421b2b85891e5204d53f1b
                update:
                - name: translator
                  uuid: d84a6f054a3f4ed68a6f054a3f1ed635
                - name: editor
                  uuid: 01ed2f8647421b2b85891e5204d53f1b
                delete:
                - name: editor
                  uuid: 01ed2f8647421b2b85891e5204d53f1b
      security:
      - bearerAuth: []
    put:
      description: Revoke permissions on the schema from multiple roles.
      parameters:
      - name: schemaUuid
        in: path
        description: Uuid of the schema
        required: true
        schema:
          type: string
          description: Uuid of the schema
          example: 2aa83a2b3cba40a1a83a2b3cba90a1de
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectPermissionRevokeRequest"
            example: |-
              {
                "create" : [ {
                  "name" : "editor",
                  "uuid" : "01ed2f8647421b2b85891e5204d53f1b"
                } ],
                "read" : [ {
                  "name" : "translator",
                  "uuid" : "d84a6f054a3f4ed68a6f054a3f1ed635"
                }, {
                  "name" : "editor",
                  "uuid" : "01ed2f8647421b2b85891e5204d53f1b"
                } ],
                "update" : [ {
                  "name" : "translator",
                  "uuid" : "d84a6f054a3f4ed68a6f054a3f1ed635"
                }, {
                  "name" : "editor",
                  "uuid" : "01ed2f8647421b2b85891e5204d53f1b"
                } ],
                "delete" : [ {
                  "name" : "editor",
                  "uuid" : "01ed2f8647421b2b85891e5204d53f1b"
                } ]
              }
      responses:
        default:
          description: application/json
          content:
            application/json: {}
        "200":
          description: Updated permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectPermissionResponse"
              example:
                create:
                - name: editor
                  uuid: 01ed2f8647421b2b85891e5204d53f1b
                read:
                - name: translator
                  uuid: d84a6f054a3f4ed68a6f054a3f1ed635
                - name: editor
                  uuid: 01ed2f8647421b2b85891e5204d53f1b
                update:
                - name: translator
                  uuid: d84a6f054a3f4ed68a6f054a3f1ed635
                - name: editor
                  uuid: 01ed2f8647421b2b85891e5204d53f1b
                delete:
                - name: editor
                  uuid: 01ed2f8647421b2b85891e5204d53f1b
      security:
      - bearerAuth: []
    post:
      description: Grant permissions on the schema to multiple roles.
      parameters:
      - name: schemaUuid
        in: path
        description: Uuid of the schema
        required: true
        schema:
          type: string
          description: Uuid of the schema
          example: 2aa83a2b3cba40a1a83a2b3cba90a1de
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectPermissionGrantRequest"
            example: |-
              {
                "create" : [ {
                  "name" : "editor",
                  "uuid" : "01ed2f8647421b2b85891e5204d53f1b"
                } ],
                "read" : [ {
                  "name" : "translator",
                  "uuid" : "d84a6f054a3f4ed68a6f054a3f1ed635"
                }, {
                  "name" : "editor",
                  "uuid" : "01ed2f8647421b2b85891e5204d53f1b"
                } ],
                "update" : [ {
                  "name" : "translator",
                  "uuid" : "d84a6f054a3f4ed68a6f054a3f1ed635"
                }, {
                  "name" : "editor",
                  "uuid" : "01ed2f8647421b2b85891e5204d53f1b"
                } ],
                "delete" : [ {
                  "name" : "editor",
                  "uuid" : "01ed2f8647421b2b85891e5204d53f1b"
                } ],
                "exclusive" : true,
                "ignore" : [ {
                  "name" : "admin",
                  "uuid" : "ea62944f21174870914d6cc330a694df"
                } ]
              }
      responses:
        default:
          description: application/json
          content:
            application/json: {}
        "200":
          description: Updated permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectPermissionResponse"
