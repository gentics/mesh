  /api/v2/{project}/webrootfield/{fieldName}/{path}:
    description: Update the field variants with the given name from the given path.
    get:
      description: Download the field with the given name from the given path. You
        can use image query parameters for crop and resize if the binary data represents
        an image.
      parameters:
      - name: fpz
        in: query
        description: Set the focal point zoom factor. The value must be greater than
          one.
        required: false
        schema:
          type: number
          description: Set the focal point zoom factor. The value must be greater
            than one.
          format: double
          example: "1.5"
      - name: rect
        in: query
        description: Set image crop area.
        required: false
        schema:
          type: string
          description: Set image crop area.
          example: "20,20,128,128"
      - name: w
        in: query
        description: Set image target width. The height will automatically be calculated
          if the width was omitted.
        required: false
        schema:
          type: number
          description: Set image target width. The height will automatically be calculated
            if the width was omitted.
          format: double
          example: "1280"
      - name: h
        in: query
        description: Set image target height. The width will automatically be calculated
          if the height was omitted.
        required: false
        schema:
          type: number
          description: Set image target height. The width will automatically be calculated
            if the height was omitted.
          format: double
          example: "720"
      - name: resize
        in: query
        description: "Set the resize mode. Possible modes: \nforce : The force mode\
          \ will resize the image to the specified dimensions. This can lead to a\
          \ distorted image when the aspect ratio of the source image does not match\
          \ the destination aspect ratio\nsmart : The smart mode will resize the image\
          \ proportionally so that the resulting destination format matches the source\
          \ format in at least one dimension. No distortion of the image will occur.\n\
          prop : The prop mode will resize the image proportionally so that the resulting\
          \ destination format fits inside the provided dimensions. No distortion\
          \ of the image will occur."
        required: false
        schema:
          type: string
          description: "Set the resize mode. Possible modes: \nforce : The force mode\
            \ will resize the image to the specified dimensions. This can lead to\
            \ a distorted image when the aspect ratio of the source image does not\
            \ match the destination aspect ratio\nsmart : The smart mode will resize\
            \ the image proportionally so that the resulting destination format matches\
            \ the source format in at least one dimension. No distortion of the image\
            \ will occur.\nprop : The prop mode will resize the image proportionally\
            \ so that the resulting destination format fits inside the provided dimensions.\
            \ No distortion of the image will occur."
          example: smart
      - name: version
        in: query
        description: "Specifies the version to be loaded. Can either be published/draft\
          \ or version number. e.g.: _0.1_, _1.0_, _draft_, _published_."
        required: false
        schema:
          type: string
          description: "Specifies the version to be loaded. Can either be published/draft\
            \ or version number. e.g.: _0.1_, _1.0_, _draft_, _published_."
          example: "1.1"
          default: draft
      - name: fpy
        in: query
        description: Set the focal point y factor between 0  and 1 where 0.5 is the
          middle of the image. You can use this parameter in combination with the
          crop=fp parameter in order to crop and resize the image in relation to the
          given point.
        required: false
        schema:
          type: number
          description: Set the focal point y factor between 0  and 1 where 0.5 is
            the middle of the image. You can use this parameter in combination with
            the crop=fp parameter in order to crop and resize the image in relation
            to the given point.
          format: double
          example: "0.2"
      - name: crop
        in: query
        description: "Set the crop mode. Possible modes: \nrect : The rect mode will\
          \ work in combination with the rect parameter and crop the specified area.\n\
          fp : The fp mode will utilize the specified or pre-selected focal point\
          \ and crop the image according to the position of the focus point and the\
          \ specified image size."
        required: false
        schema:
          type: string
          description: "Set the crop mode. Possible modes: \nrect : The rect mode\
            \ will work in combination with the rect parameter and crop the specified\
            \ area.\nfp : The fp mode will utilize the specified or pre-selected focal\
            \ point and crop the image according to the position of the focus point\
            \ and the specified image size."
          example: rect
      - name: fpx
        in: query
        description: Set the focal point x factor between 0  and 1 where 0.5 is the
          middle of the image.  You can use this parameter in combination with the
          crop=fp parameter in order to crop and resize the image in relation to the
          given point.
        required: false
        schema:
          type: number
          description: Set the focal point x factor between 0  and 1 where 0.5 is
            the middle of the image.  You can use this parameter in combination with
            the crop=fp parameter in order to crop and resize the image in relation
            to the given point.
          format: double
          example: "0.1"
      - name: path
        in: path
        description: Path to the node
        required: true
        schema:
          type: string
          description: Path to the node
          example: /News/2015/Images/flower.jpg
      - name: fieldName
        in: path
        description: Name of the field which should be acquired.
        required: true
        schema:
          type: string
          description: Name of the field which should be acquired.
          example: stringField
      - name: project
        in: path
        description: Name of the related project
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "JSON for a node/micronode/list field value, or the binary\
            \ data for the binary field, or the text data for any other field of the\
            \ node for the given path."
      security:
      - bearerAuth: []
    post:
      description: Update the field variants with the given name from the given path.
      parameters:
      - name: version
        in: query
        description: "Specifies the version to be loaded. Can either be published/draft\
