      - bearerAuth: []
  /api/v2/utilities/linkResolver:
    description: "Return the posted text and resolve and replace all found mesh links.\
      \ A mesh link must be in the format {{mesh.link(\"UUID\",\"languageTag\")}}"
    post:
      description: "Return the posted text and resolve and replace all found mesh\
        \ links. A mesh link must be in the format {{mesh.link(\"UUID\",\"languageTag\"\
        )}}"
      parameters:
      - name: lang
        in: query
        description: ISO 639-1 language tag of the language which should be loaded.
          Fallback handling can be applied by specifying multiple languages in a comma-separated
          list. The first matching language will be returned.  If omitted or the requested
          language is not available then the _defaultLanguage_ as configured in _mesh.yml_
          will be returned.
        required: false
        schema:
          type: string
          description: ISO 639-1 language tag of the language which should be loaded.
            Fallback handling can be applied by specifying multiple languages in a
            comma-separated list. The first matching language will be returned.  If
            omitted or the requested language is not available then the _defaultLanguage_
            as configured in _mesh.yml_ will be returned.
          example: "en,de"
      - name: resolveLinks
        in: query
        description: "The resolve links parameter can be set to either _short_, _medium_\
          \ or _full_. Stored mesh links will automatically be resolved and replaced\
          \ by the resolved webroot link. With the parameter set the _path_ property\
          \ as well as the _languagesPath_ property (for available language variants)\
          \ will be included in the response. Gentics Mesh links in any HTML-typed\
          \ field will automatically be resolved and replaced by the resolved WebRoot\
          \ path. No resolving occurs if no link has been specified."
        required: false
        schema:
          type: string
          description: "The resolve links parameter can be set to either _short_,\
            \ _medium_ or _full_. Stored mesh links will automatically be resolved\
            \ and replaced by the resolved webroot link. With the parameter set the\
            \ _path_ property as well as the _languagesPath_ property (for available\
            \ language variants) will be included in the response. Gentics Mesh links\
            \ in any HTML-typed field will automatically be resolved and replaced\
            \ by the resolved WebRoot path. No resolving occurs if no link has been\
            \ specified."
          example: medium
          enum:
          - "off"
          - short
          - medium
          - full
      requestBody:
        content:
          text/plain:
            example: "Some text before {{mesh.link(\"adaf48da8c124049af48da8c12a0493e\"\
              , \"en\")}} and after."
      responses:
        "200":
          description: Some text before /api/v2/dummy/webroot/flower.jpg and after
      security:
      - bearerAuth: []
  /api/v2/utilities/validateSchema:
    description: Validate the posted schema and report errors.
    post:
      description: Validate the posted schema and report errors.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaUpdateRequest"
            example: |-
              {
                "description" : "New description",
                "name" : "extended-content",
                "fields" : [ ],
                "microschema" : false
              }
      responses:
        "200":
          description: The validation message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaValidationResponse"
              example:
                status: VALID
                message:
                  message: Schema validation was successful.
                elasticsearch:
                  settings:
                    analysis:
                      analyzer:
                        trigrams:
                          tokenizer: my_ngram_tokenizer
                          filter:
                          - lowercase
                      tokenizer:
                        my_ngram_tokenizer:
                          type: nGram
                          min_gram: "3"
                          max_gram: "3"
                    somebogus: value
                  mappings:
                    default:
                      properties:
                        uuid:
                          type: string
                          index: not_analyzed
                        created:
                          type: date
                          index: not_analyzed
                        edited:
                          type: date
                          index: not_analyzed
                        editor:
                          type: object
                          properties:
                            uuid:
                              type: string
                              index: not_analyzed
                        creator:
                          type: object
                          properties:
                            uuid:
                              type: string
                              index: not_analyzed
                        _roleUuids:
                          type: string
                          index: not_analyzed
                        project:
                          type: object
                          properties:
                            name:
                              type: string
                              index: analyzed
                              analyzer: trigrams
                              fields:
                                raw:
                                  type: string
                                  index: not_analyzed
                            uuid:
                              type: string
                              index: not_analyzed
                        tags:
                          type: nested
                          properties:
                            name:
                              type: string
                              index: analyzed
                              analyzer: trigrams
                              fields:
                                raw:
                                  type: string
                                  index: not_analyzed
                            uuid:
                              type: string
                              index: not_analyzed
                        tagFamilies:
                          type: object
                          dynamic: true
                        language:
                          type: string
                          index: not_analyzed
                        schema:
                          type: object
                          properties:
                            uuid:
                              type: string
                              index: not_analyzed
                            name:
                              type: string
                              index: analyzed
                              analyzer: trigrams
                              fields:
                                raw:
                                  type: string
                                  index: not_analyzed
                            version:
                              type: string
                              index: not_analyzed
                        displayField:
                          type: object
                          properties:
                            key:
                              type: string
                              index: analyzed
                              analyzer: trigrams
                              fields:
                                raw:
                                  type: string
                                  index: not_analyzed
                            value:
                              type: string
                              index: analyzed
                              analyzer: trigrams
                              fields:
                                raw:
                                  type: string
                                  index: not_analyzed
                        parentNode:
                          type: object
                          properties:
                            uuid:
                              type: string
                              index: not_analyzed
                        fields:
                          properties: {}
                      dynamic: strict
                      dynamic_templates:
                      - tagFamilyUuid:
                          path_match: tagFamilies.*.uuid
                          match_mapping_type: '*'
                          mapping:
                            type: string
                            index: not_analyzed
                      - tagFamilyTags:
                          path_match: tagFamilies.*.tags
                          match_mapping_type: '*'
                          mapping:
                            type: nested
                            properties:
                              name:
                                type: string
                                index: analyzed
                                analyzer: trigrams
                                fields:
                                  raw:
                                    type: string
                                    index: not_analyzed
                              uuid:
                                type: string
                                index: not_analyzed
      security:
      - bearerAuth: []
