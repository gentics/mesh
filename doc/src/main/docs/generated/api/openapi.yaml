          \ the destination aspect ratio\nsmart : The smart mode will resize the image\
          \ proportionally so that the resulting destination format matches the source\
          \ format in at least one dimension. No distortion of the image will occur.\n\
          prop : The prop mode will resize the image proportionally so that the resulting\
          \ destination format fits inside the provided dimensions. No distortion\
          \ of the image will occur."
