openapi: 3.0.2
servers: 
  - url: "http://localhost:8080/api/v2"
info:
  title: Formgenerator-Plugin
  version: "1.3.6"
paths:
  /{project}/plugins/fg/forms:
    parameters:
      - $ref: '#/components/parameters/project'
    get:
      summary: List all forms
      tags:
        - Forms
      parameters: 
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        "200":
          description: A page of forms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormPage"
    post:
      summary: Create a new form
      tags:
        - Forms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Form'
      responses:
        "200":
          $ref: '#/components/responses/FormResponse'
  /{project}/plugins/fg/forms/{formUuid}:
    parameters:
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/formUuid'
    get:
      summary: Load a specific form
      tags: 
        - Forms
      responses:
        "200":
          $ref: '#/components/responses/FormResponse'
    post:
      summary: Update a form
      tags:
        - Forms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Form'
      responses:
        "200":
          $ref: '#/components/responses/FormResponse'
    delete:
      summary: Delete a form
      tags:
        - Forms
      responses:
        "204":
          description: The form was deleted successfully
  /{project}/plugins/fg/forms/{formUuid}/elements:
    parameters:
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/formUuid'
    get:
      summary: Load elements of a form
      tags:
        - Forms
      responses:
        "200":
          description: Form elements
          content:
            application/json:
              schema:
                properties:
                  elements:
                    type: array
                    items:
                      type: object
  /{project}/plugins/fg/forms/{formUuid}/schema:
    parameters:
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/formUuid'
    get:
      summary: Load a form schema
      tags:
        - Forms
      responses:
        "200":
          description: The form schema
          content:
            application/json:
              schema:
                type: object
  /{project}/plugins/fg/forms/{formUuid}/export:
    parameters:
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/formUuid'
      - name: format
        in: query
        required: false
        schema:
          type: string
          default: "csv"
    get:
      summary: Export Form
      tags:
        - Forms
      responses:
        "200":
          description: Exported Form
  /{project}/plugins/fg/forms/{formUuid}/binaries:
    parameters:
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/formUuid'
    get:
      tags:
        - Forms
      summary: Download binary data
      description: Downloads all files of all form data of a form as a single zip file
      responses:
        "200":
          description: A zip file containing all binaries
          content:
            application/zip:
              schema:
                type: string
                format: binary
  /{project}/plugins/fg/forms/{formUuid}/data:
    parameters:
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/formUuid'
    get:
      parameters: 
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: q
          in: query
          description: Search query - This will use ElasticSearch to search all fields of the form data
          schema:
            type: string
      summary: List all form data from a form
      tags:
        - Form Data
      responses:
        "200":
          description: Page of form data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDataPage'
    post:
      parameters:
        - $ref: '#/components/parameters/publish'
      summary: Create form data
      tags: 
       - Form Data
      requestBody:
        description: Form data
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FormData'
      responses:
        "205":
          description: Form data saved successfully
        "303":
          description: Redirects to configured URL
  /{project}/plugins/fg/forms/{formUuid}/jsondata:
    parameters:
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/formUuid'
    post:
      parameters:
        - $ref: '#/components/parameters/publish'
      summary: Create form data
      tags: 
       - Form Data
      requestBody:
        description: Form data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormData'
      responses:
        "200":
          description: Created form data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDataResponse'
  /{project}/plugins/fg/forms/{formUuid}/data/{formDataUuid}:
    parameters:
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/formUuid'
      - $ref: '#/components/parameters/formDataUuid'
    get:
      summary: Load/Render specific form data
      tags: 
       - Form Data
      responses:
        "200":
          description: Form data as JSON or rendered as HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDataResponse'
            text/html:
              schema:
                type: string
    post:
      parameters:
        - $ref: '#/components/parameters/publish'
      summary: Update form data
      tags: 
       - Form Data
      requestBody:
        description: Form data
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FormData'
      responses:
        "205":
          description: Form data saved successfully
        "303":
          description: Redirects to configured URL
    delete:
      summary: Delete form data
      tags:
        - Form Data
      responses:
        "204":
          description: Form data was deleted successfully
  /{project}/plugins/fg/forms/{formUuid}/jsondata/{formDataUuid}:
    parameters:
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/formUuid'
      - $ref: '#/components/parameters/formDataUuid'
    post:
      parameters:
        - $ref: '#/components/parameters/publish'
      summary: Update form data
      tags: 
       - Form Data
      requestBody:
        description: Form data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormData'
      responses:
        "200":
          description: Updated form data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDataResponse'
  /{project}/plugins/fg/forms/{formUuid}/jsondata/{formDataUuid}/binary/{binaryFieldName}:
    parameters:
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/formUuid'
      - $ref: '#/components/parameters/formDataUuid'
      - name: binaryFieldName
        required: true
        description: The field name of the binary
        in: path
        schema:
          type: string
    get:
      tags: 
        - Form Data
      summary: Download a binary
      responses:
        "200":
          description: Binary data
  /{project}/plugins/fg/templates:
    parameters:
      - $ref: '#/components/parameters/project'
    get:
      tags:
        - Templates
      summary: List all templates
      responses:
        "200":
          description: A list of all templates
          content:
            application/json:
              schema:
                properties:
                  templates:
                    properties:
                      global:
                        type: array
                        items:
                          $ref: '#/components/schemas/TemplateResponse'
                      user:
                        type: array
                        items:
                          $ref: '#/components/schemas/TemplateResponse'
    post:
      tags:
        - Templates
      summary: Create template
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Template'
      responses:
        "200":
          $ref: '#/components/responses/TemplateResponse'
  /{project}/plugins/fg/templates/{templateUuid}:
    parameters:
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/templateUuid'
    get:
      tags:
        - Templates
      summary: Load a specific template
      responses:
        "200":
          $ref: '#/components/responses/TemplateResponse'
    delete:
      tags:
        - Templates
      summary: Delete a template
      responses:
        "204":
          description: The template was deleted successfully
components:
  responses:
    TemplateResponse:
      description: A template
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TemplateResponse'      
    FormResponse:
      description: The created form
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormResponse'
  requestBodies:
    FormCreateRequest:
      content:
        application/json:
          schema:
            type: object
            
  parameters:
    publish:
      in: query
      name: publish
      description: If false, the saved form data will not be published
      schema:
        type: boolean
        default: true
    project:
      in: path
      required: true
      description: The project name
      example: "demo"
      name: project
      schema:
        type: string
        minLength: 1
    formUuid:
      in: path
      required: true
      description: The form UUID
      example: "bff1326e4cc946ff93e331d0be39217c"
      name: formUuid
      schema:
        $ref: '#/components/schemas/uuid'
    formDataUuid:
      in: path
      required: true
      description: The form data UUID
      example: "91f97955b0fa4822834f47dd69960149"
      name: formDataUuid
      schema:
        $ref: '#/components/schemas/uuid'
    templateUuid:
      in: path
      required: true
      description: The form data UUID
      example: "da1cc077e11a4d6caa7c62109587546b"
      name: templateUuid
      schema:
        $ref: '#/components/schemas/uuid'
    page:
      in: query
      name: page
      required: false
      schema:
        type: number
        default: 1
        minimum: 1
    perPage:
      in: query
      name: perPage
      description: The number of elements per page. Per default all elements will be fetched.
      required: false
      schema:
        type: number
        minimum: 0
  schemas:
    Form:
      type: object
      properties:
        name:
          type: string
          example: "Formular Nr. 1"
        pageId:
          type: number
          example: 1234
    FormResponse:
      allOf:
        - properties:
            uuid:
              $ref: '#/components/schemas/uuid'
        - $ref: '#/components/schemas/Form'
    FormPage:
      allOf:
        - $ref: '#/components/schemas/PageProperties'
        - properties:
            forms:
              type: array
              items:
                $ref: '#/components/schemas/FormResponse'
    FormData:
      type: object
    FormDataResponse:
      allOf:
        - properties:
            uuid:
              $ref: '#/components/schemas/uuid'
        - $ref: '#/components/schemas/FormDataResponse'
    FormDataPage:
      allOf:
        - $ref: '#/components/schemas/PageProperties'
        - properties:
            entries:
              type: array
              items:
                $ref: '#/components/schemas/FormDataResponse'
    Template:
      properties:
        name:
          type: string
        json:
          type: string
    TemplateResponse:
      allOf:
        - properties:
            id:
              $ref: '#/components/schemas/uuid'
        - $ref: '#/components/schemas/Template'
    PageProperties:
      type: object
      properties:
        totalCount:
          type: number
          minimum: 0
          example: 1
        currentPage:
          type: number
          minimum: 0
          example: 1
        pageCount:
          type: number
          minimum: 0
          example: 1
        perPage:
          type: number
          minimum: 1
          example: 10
    uuid:
      type: string
      pattern: "[0-9a-f]{32}"
      example: "29a53fee7af6468da53fee7af6568d75"