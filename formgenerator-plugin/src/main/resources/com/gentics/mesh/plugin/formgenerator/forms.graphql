query Forms($perPage: Long = 2147483647, $page: Long = 1) {
  schema(name: "formgenerator") {
    nodes(perPage: $perPage, page: $page) {
      elements {
        uuid
        fields {
          ... on formgenerator {
            name
            pageId
          }
        }
      }
      totalCount
      currentPage
      pageCount
      perPage
    }
  }
}