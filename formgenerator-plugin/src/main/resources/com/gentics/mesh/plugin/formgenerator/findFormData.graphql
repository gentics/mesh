query ($query: String, $perPage: Long = 2147483647, $page: Long = 1) {
  nodes (query: $query, perPage: $perPage, page: $page) {
    elements {
      uuid
      fields {
        ... on {{{ schemaName }}} {
          {{{ fieldNames }}}
        }
      }
    }
    totalCount
    currentPage
    pageCount
    perPage
  }
}
