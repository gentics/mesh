query ($uuids: [String], $lang: String) {
  nodes(uuids: $uuids, lang: [ $lang ]) {
    elements {
      languages {
        uuid
        language
        path
        fields {
          ... on {{{ contentSchema }}} {
            teaser
          }
        }
      }
      breadcrumb {
        fields {
          ... on {{{ folderSchema }}} {
            name
            navhidden
          }
        }
      }
    }
  }
}
