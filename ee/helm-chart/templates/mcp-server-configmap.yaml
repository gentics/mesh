{{- if .Values.mcpServer.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mesh.mcpServer.fullname" . }}
  labels:
    {{- include "mesh.mcpServer.labels" . | nindent 4 }}
data:
  # ── Mesh-Anbindung ────────────────────────────────────────────────────
  MESH_BASE_URL: {{ include "mesh.mcpServer.meshBaseUrl" . | quote }}
  MESH_ALLOWED_PROJECTS: {{ .Values.mcpServer.mesh.allowedProjects | quote }}
  {{- if .Values.mcpServer.mesh.allowedSchemas }}
  MESH_ALLOWED_SCHEMAS: {{ .Values.mcpServer.mesh.allowedSchemas | quote }}
  {{- end }}
  MESH_ALLOWED_LANGUAGES: {{ .Values.mcpServer.mesh.allowedLanguages | quote }}
  MESH_READ_ONLY: {{ .Values.mcpServer.mesh.readOnly | quote }}
  MESH_GRAPHQL_MAX_DEPTH: {{ .Values.mcpServer.mesh.graphqlMaxDepth | quote }}
  MESH_GRAPHQL_TIMEOUT_MS: {{ .Values.mcpServer.mesh.graphqlTimeoutMs | quote }}
  LOG_LEVEL: {{ .Values.mcpServer.logLevel | quote }}

  # ── Transport ─────────────────────────────────────────────────────────
  MCP_TRANSPORT: {{ .Values.mcpServer.transport.mode | quote }}
  {{- if eq .Values.mcpServer.transport.mode "http" }}
  MCP_HTTP_HOST: {{ .Values.mcpServer.transport.http.host | quote }}
  MCP_HTTP_PORT: {{ .Values.mcpServer.transport.http.port | quote }}
  MCP_AUTH_DISABLED: {{ .Values.mcpServer.transport.auth.disabled | quote }}
  {{- with .Values.mcpServer.transport.cors.origins }}
  MCP_CORS_ORIGINS: {{ join "," . | quote }}
  {{- end }}
  {{- end }}

  # ── Mesh-Schutz ───────────────────────────────────────────────────────
  MCP_RATE_LIMIT_PER_SECOND: {{ .Values.mcpServer.protection.rateLimit.globalPerSecond | quote }}
  MCP_RATE_LIMIT_PER_TOKEN_PER_SECOND: {{ .Values.mcpServer.protection.rateLimit.perTokenPerSecond | quote }}
  MCP_MESH_MAX_CONCURRENT: {{ .Values.mcpServer.protection.maxConcurrent | quote }}
  MCP_CIRCUIT_BREAKER_ENABLED: {{ .Values.mcpServer.protection.circuitBreaker.enabled | quote }}
  MCP_CIRCUIT_BREAKER_FAILURE_RATE_PERCENT: {{ .Values.mcpServer.protection.circuitBreaker.failureRatePercent | quote }}
  MCP_CIRCUIT_BREAKER_WINDOW_SIZE: {{ .Values.mcpServer.protection.circuitBreaker.windowSize | quote }}
  MCP_CIRCUIT_BREAKER_OPEN_DURATION_MS: {{ .Values.mcpServer.protection.circuitBreaker.openDurationMs | quote }}
  MCP_GRAPHQL_MAX_QUERY_LENGTH: {{ .Values.mcpServer.protection.graphqlMaxQueryLength | quote }}
{{- end }}
