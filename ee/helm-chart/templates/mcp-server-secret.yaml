{{- if .Values.mcpServer.enabled -}}
{{- /* No Mesh-credential Secret: the chart configures no Mesh identity. See the
       `mcpServer.mesh` comments in values.yaml. The only Secret here is the MCP
       server's own bearer token. */ -}}
{{- if and (eq .Values.mcpServer.transport.mode "http") (not .Values.mcpServer.transport.auth.disabled) (not .Values.mcpServer.transport.auth.existingSecret) }}
{{- /* Bearer token: explicit value wins; otherwise generated once and reused
       across upgrades (lookup). For GitOps/Argo CD use
       transport.auth.existingSecret (see README). */ -}}
{{- $secretName := printf "%s-auth" (include "mesh.mcpServer.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $token := .Values.mcpServer.transport.auth.token | default "" }}
{{- if not $token }}
{{- if $existing }}
{{- $token = index $existing.data "MCP_AUTH_TOKEN" | default "" | b64dec }}
{{- end }}
{{- end }}
{{- if not $token }}
{{- $token = randAlphaNum 32 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "mesh.mcpServer.labels" . | nindent 4 }}
type: Opaque
stringData:
  MCP_AUTH_TOKEN: {{ $token | quote }}
{{- end }}
{{- end }}
