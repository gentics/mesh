{{- /*
Holder for the Mesh API key consumed by the CMP portals (key "apikey").
ALWAYS rendered (empty): the apikey job (generateApiKey=true) patches the
token into the live object; Helm's three-way merge never reverts it because
this manifest stays empty in every revision. Keeping the Secret unconditional
means toggling generateApiKey off later does NOT delete the stored key.
Consumers referencing the "apikey" key stay in CreateContainerConfigError
until the key has been patched in.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mesh-secret
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: mesh-apikey
type: Opaque
