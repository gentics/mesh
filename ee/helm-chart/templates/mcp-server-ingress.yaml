{{- if and .Values.mcpServer.enabled (eq .Values.mcpServer.transport.mode "http") .Values.mcpServer.ingress.enabled -}}
{{- $fullName := include "mesh.mcpServer.fullname" . -}}
{{- $svcPort := .Values.mcpServer.transport.http.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "mesh.mcpServer.labels" . | nindent 4 }}
  {{- with .Values.mcpServer.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.mcpServer.ingress.tls }}
  tls:
  {{- range .Values.mcpServer.ingress.tls }}
    - hosts:
      {{- range .hosts }}
        - {{ . | quote }}
      {{- end }}
      secretName: {{ .secretName }}
  {{- end }}
  {{- end }}
  {{- if .Values.mcpServer.ingress.ingressClassName }}
  ingressClassName: {{ .Values.mcpServer.ingress.ingressClassName }}
  {{- end }}
  rules:
  {{- range .Values.mcpServer.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
        {{- end }}
  {{- end }}
{{- end }}
