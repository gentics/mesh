{{- if and .Values.contentRag.enabled (include "mesh.contentRag.hasSecret" .) -}}
{{- /* Only the secrets set in the chart. With contentRag.elasticsearch.existingSecret
       the chart creates nothing and only references - that Secret then has to carry
       the keys used here (RAG_ELASTICSEARCH_PASSWORD, TEI_API_KEY, LLM_API_KEY),
       because envFrom turns them into environment variables unchanged. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mesh.contentRag.secretName" . }}
  labels:
    {{- include "mesh.contentRag.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.contentRag.elasticsearch.password }}
  RAG_ELASTICSEARCH_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.contentRag.inference.apiKey }}
  TEI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.contentRag.llm.apiKey }}
  LLM_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
