# ─────────────────────────────────────────────────────────────────────────────
# Gentics Mesh MCP Server (sub-component)
#
# Provides a Model Context Protocol interface for LLM clients
# (Claude Desktop, OpenAI Agents, LangChain, n8n, Open WebUI, …).
# Six read-only tools, runs as a separate Deployment pod next to Mesh.
#
# Disabled by default — enable via `mcpServer.enabled=true`.
# Source: mesh-enterprise/mcp-server/
# ─────────────────────────────────────────────────────────────────────────────
mcpServer:
  enabled: false

  image:
    ## Registry and repository are combined to "registry/repository:tag".
    ## global.imageRegistry (umbrella mirror override) takes precedence over registry.
    registry: docker.gentics.com
    repository: gentics/mesh-enterprise/mcp-server
    # tag: ""   # default: Chart.AppVersion
    pullPolicy: IfNotPresent
    # pullSecret: docker-gentics-com

  replicaCount: 1

  ## PodDisruptionBudget — only applied when replicaCount > 1.
  podDisruptionBudget:
    ## Minimum number/percentage of pods that must stay available during
    ## voluntary disruptions (node drains, cluster upgrades).
    minAvailable: "50%"
    ## Alternative to minAvailable — if set, it is used INSTEAD of minAvailable
    ## (Kubernetes allows only one of the two).
    # maxUnavailable: 1

  # Transport mode.
  #   "stdio" – only reachable via `kubectl exec -i` or a sidecar (no Service).
  #   "http"  – creates Service + optional Ingress, JSON-RPC via POST /mcp.
  transport:
    mode: http
    http:
      port: 3001
      host: "0.0.0.0"
    auth:
      # false: the MCP server checks the bearer token below. Mesh calls then run
      #        ANONYMOUSLY — that token is an MCP credential and is never forwarded.
      # true:  the MCP server checks nothing, so the caller's
      #        `Authorization: Bearer …` is passed through to Mesh per request and
      #        Mesh applies that user's permissions (no header = anonymous). This is
      #        the mode for per-user Mesh permissions, but it also means anyone who
      #        reaches the port can call tools — put a reverse proxy in front.
      disabled: false
      # Inline token (testing only). Empty: a token is generated once at install
      # and reused across upgrades (see NOTES for the retrieval command).
      token: ""
      # Existing Secret with key MCP_AUTH_TOKEN.
      # Recommended for GitOps/Argo CD (see README "Deploying with Argo CD").
      existingSecret: ""
    cors:
      # Comma-separated CORS origin allowlist; "*" allows all.
      origins: []

  # Mesh connection.
  #
  # The chart configures NO Mesh credentials. Who the MCP server is towards Mesh
  # follows from the transport:
  #   transport.mode=http, auth.disabled=false -> Mesh sees anonymous requests.
  #       The bearer token authenticates the client to the MCP server; it belongs
  #       to MCP, not to Mesh, and is never forwarded. Mesh's `anonymous` role
  #       needs read permission on every project in `allowedProjects`, otherwise
  #       all tools return empty results.
  #   transport.mode=http, auth.disabled=true  -> the caller's
  #       `Authorization: Bearer …` is passed through to Mesh per request and Mesh
  #       decides what that user may see. Without a header: anonymous.
  #   transport.mode=stdio -> the server needs a fixed identity. Supply it via
  #       `extraEnv` (MESH_API_KEY, or MESH_USERNAME + MESH_PASSWORD).
  #
  # Setting MESH_API_KEY / MESH_USERNAME / MESH_PASSWORD in http mode makes the
  # server refuse to start — they would have no effect there.
  mesh:
    # Default: in-cluster service DNS of the Mesh component of this release.
    # When empty, derived from `mesh.fullname` + service.mesh.port.
    baseUrl: ""
    allowedProjects: "demo"
    allowedSchemas: ""           # leer = alle erlaubt
    allowedLanguages: "de,en"
    readOnly: true
    graphqlMaxDepth: 6
    graphqlTimeoutMs: 5000

  # Protection layers: prevent an LLM from flooding Mesh with requests.
  protection:
    rateLimit:
      globalPerSecond: 50
      perTokenPerSecond: 20
    maxConcurrent: 10
    circuitBreaker:
      enabled: true
      failureRatePercent: 50
      windowSize: 20
      openDurationMs: 30000
    graphqlMaxQueryLength: 4000

  logLevel: "info"

  # Additional environment variables passed through directly.
  extraEnv: []

  service:
    type: ClusterIP
    annotations: {}
    # When transport.mode = "stdio", no Service is created.

  ingress:
    enabled: false
    annotations: {}
    # ingressClassName: nginx
    hosts:
      - host: mesh-mcp.local
        paths:
          - "/"
    tls: []
    #  - secretName: mcp-tls
    #    hosts:
    #      - mesh-mcp.local

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 768Mi

  podSecurityContext:
    runAsUser: null
    fsGroup: null
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}


  startupProbe:
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3


# ── Content RAG (rag-service) ─────────────────────────────────────────────────
# Retrieval-augmented generation over Mesh content. A standalone HTTP service
# that only READS: the RAG indices are filled by Mesh through its standard sync,
# the service merely queries them. Hence no PVC, no init container, no job.
contentRag:
  enabled: false

  image:
    ## Registry and repository are combined to "registry/repository:tag".
    ## global.imageRegistry (umbrella mirror override) takes precedence over registry.
    registry: docker.gentics.com
    repository: gentics/mesh-enterprise/content-rag
    # tag: ""   # default: Chart.AppVersion
    pullPolicy: IfNotPresent
    # pullSecret: docker-gentics-com

  ## Configuration and audit currently live in the memory of the pod (in-memory
  ## stores), so with more than one replica each keeps its own state. The query
  ## path itself is stateless - until there are persistent backends, stay at 1.
  replicaCount: 1

  ## PodDisruptionBudget — only applied when replicaCount > 1.
  podDisruptionBudget:
    minAvailable: "50%"
    ## Alternative to minAvailable — if set, it is used INSTEAD of minAvailable.
    # maxUnavailable: 1

  http:
    ## Container and service port. Also passed to the service as SERVER_PORT.
    port: 8090

  elasticsearch:
    ## Empty = elasticsearch.url resp. elasticsearch.prefix of this chart: the RAG
    ## chunks live in the same Elasticsearch as the full-text search.
    ## If nothing is configured there (url: "null"), rendering fails.
    url: ""
    ## MUST match the prefix Mesh writes with (MESH_ELASTICSEARCH_PREFIX /
    ## elasticsearch.prefix). If not set it uses the one configured for mesh
    #prefix: ""
    ## Basic auth, only for a secured Elasticsearch.
    username: ""
    password: ""
    ## An existing Secret instead of the values above. It has to carry the keys
    ## the service expects as environment variables: RAG_ELASTICSEARCH_PASSWORD,
    ## TEI_API_KEY, MESH_API_TOKEN, LLM_API_KEY - only the ones actually needed.
    existingSecret: ""

  inference:
    ## Base URL of the embedding server (TEI), WITHOUT /embed - the service
    ## appends the path itself.
    ##
    ## IMPORTANT: this address is called by ELASTICSEARCH, not by the rag-service.
    ## It has to resolve from the point of view of the ES cluster; a name only the
    ## namespace of the service knows leads to an error that surfaces at indexing
    ## time.
    teiUrl: ""
    ## Ignored by TEI, but required by the Elasticsearch configuration.
    apiKey: ""
    id: mesh-content-rag-embeddings
    pipelineId: mesh-content-rag-embed
    ## Vector dimension of the model - has to match the model behind the endpoint
    ## (multilingual-e5-small: 384).
    dimension: 384
    shards: 1
    replicas: 1
    ## Creates the inference endpoint, ingest pipeline and index template on
    ## startup. Needs manage_index_templates, manage_pipeline and inference
    ## management in Elasticsearch. Without those permissions: set to false and
    ## provision the objects separately (the index-contract module supplies the
    ## definitions).
    bootstrap: true

  mesh:
    ## Default: in-cluster service DNS of the Mesh component of this release.
    ## REQUIRED: every request is authenticated against Mesh - the service calls
    ## GET /api/v2/auth/me to validate the caller token and resolve the roles it
    ## filters on. That happens for anonymous requests too, so Mesh has to be
    ## reachable even when auth.allowAnonymous is true.
    baseUrl: ""

  auth:
    ## Requests without a token run as the anonymous Mesh user and see only what
    ## that role may read. Set to false to allow authenticated access only - the
    ## service then answers unauthenticated requests with 401.
    ## Passed to the service as RAG_ALLOW_ANONYMOUS.
    allowAnonymous: false

  llm:
    ## Currently without effect: the only LlmProvider implementation is a stub, no
    ## call goes out to an LLM endpoint. The values are prepared, but creating a
    ## Secret for them is not worth it yet.
    profile: cloud-hybrid          # cloud-hybrid | sovereign-onprem
    model: ""
    endpoint: ""
    apiKey: ""

  retrieval:
    topK: 8
    ## Score threshold for "no answer without a basis".
    minScore: 0.2
    ## Optional hardening: additionally checks permissions live against Mesh.
    livePermissionCheck: false

  logLevel: INFO

  ## Additional environment variables passed through directly.
  extraEnv: []

  service:
    type: ClusterIP
    annotations: {}

  ingress:
    ## Deliberately off. The service authenticates callers against Mesh and
    ## filters on their roles, but with auth.allowAnonymous (default true) a
    ## request without a token is served as the anonymous Mesh user - so a public
    ## ingress exposes everything the anonymous role may read, and
    ## /api/rag/debug/chunks returns that content in plain text. Before enabling
    ## this, set auth.allowAnonymous=false or put auth in front of it.
    enabled: false
    annotations: {}
    # ingressClassName: nginx
    hosts:
      - host: mesh-content-rag.local
        paths:
          - "/"
    tls: []
    #  - secretName: content-rag-tls
    #    hosts:
    #      - mesh-content-rag.local

  ## A thin HTTP layer: the retrieval is done by Elasticsearch, the vectorisation
  ## as well. The heap follows the memory limit via MaxRAMPercentage, so do not
  ## leave the limit out.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  podSecurityContext:
    ## null = the user baked into the image (UID/GID 10001, non-root).
    runAsUser: null
    fsGroup: null
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    ## Tomcat needs a writable /tmp; the deployment mounts an emptyDir for it.
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

  ## The probe paths are fixed in the deployment: startup and liveness on
  ## /actuator/health/liveness, readiness on /actuator/health/readiness.
  ## The aggregate /actuator/health is NOT suitable as a liveness probe - it
  ## contains the Elasticsearch indicator and is DOWN whenever the cluster is
  ## unreachable.
  startupProbe:
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
