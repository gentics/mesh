# ─────────────────────────────────────────────────────────────────────────────
# Gentics Mesh MCP Server (sub-component)
#
# Provides a Model Context Protocol interface for LLM clients
# (Claude Desktop, OpenAI Agents, LangChain, n8n, Open WebUI, …).
# Six read-only tools, runs as a separate Deployment pod next to Mesh.
#
# Disabled by default — enable via `mcpServer.enabled=true`.
# Source: mesh-enterprise/mcp-server/
# ─────────────────────────────────────────────────────────────────────────────
mcpServer:
  enabled: false

  image:
    ## Registry and repository are combined to "registry/repository:tag".
    ## global.imageRegistry (umbrella mirror override) takes precedence over registry.
    registry: repo.gentics.com
    repository: mesh/mcp-server
    # tag: ""   # default: Chart.AppVersion
    pullPolicy: IfNotPresent
    ## Pull secret for the MCP-server image (overrides global.imagePullSecrets).
    # pullSecret: docker-gentics-com

  replicaCount: 1

  ## PodDisruptionBudget — only applied when replicaCount > 1.
  podDisruptionBudget:
    ## Minimum number/percentage of pods that must stay available during
    ## voluntary disruptions (node drains, cluster upgrades).
    minAvailable: "50%"
    ## Alternative to minAvailable — if set, it is used INSTEAD of minAvailable
    ## (Kubernetes allows only one of the two).
    # maxUnavailable: 1

  # Transport mode.
  #   "stdio" – only reachable via `kubectl exec -i` or a sidecar (no Service).
  #   "http"  – creates Service + optional Ingress, JSON-RPC via POST /mcp.
  transport:
    mode: http
    http:
      port: 3001
      host: "0.0.0.0"
    auth:
      # If true: the server accepts requests without auth (only acceptable behind a reverse proxy).
      disabled: false
      # Inline token (testing only). Empty: a token is generated once at install
      # and reused across upgrades (see NOTES for the retrieval command).
      token: ""
      # Existing Secret with key MCP_AUTH_TOKEN.
      # Recommended for GitOps/Argo CD (see README "Deploying with Argo CD").
      existingSecret: ""
    cors:
      # Comma-separated CORS origin allowlist; "*" allows all.
      origins: []

  # Mesh connection.
  # Default (password and existingSecret empty): automatically uses this release's
  # Mesh admin secret ("<release>-mesh-admin" or initialAdminPassword.existingSecret)
  # with user "admin" — works without any further configuration.
  mesh:
    # Default: in-cluster service DNS of the Mesh component of this release.
    # When empty, derived from `mesh.fullname` + service.mesh.port.
    baseUrl: ""
    username: "admin"
    password: ""   # for testing only; otherwise use existingSecret or the default (admin secret)
    # Existing Secret containing the Mesh password (key: existingSecretKey).
    existingSecret: ""
    # Key inside existingSecret (default: MESH_PASSWORD).
    # existingSecretKey: "MESH_PASSWORD"

    # ── API key authentication (alternative to username + password) ──────────
    # As soon as an API key is in play — apiKeyFromSecret=true or a non-empty
    # apikey — MESH_API_KEY is injected into the pod and MESH_USERNAME /
    # MESH_PASSWORD are omitted entirely; the settings above are then unused.
    #
    # apiKeyFromSecret=false + no apikey  -> username + password are used (see above).
    # apiKeyFromSecret=false + apikey set -> the chart creates the Secret secretName
    #                                        with key secretKey from the apikey value
    #                                        and uses it. secretName is MANDATORY here.
    # apiKeyFromSecret=true  + apikey set -> error: the key can only come from one place.
    # apiKeyFromSecret=true  + no apikey  -> secretName/secretKey are used as-is and are
    #                                        NOT created. The default "<release>-mesh-secret"
    #                                        is created by the CMP umbrella chart and filled
    #                                        by the apikey job (key "apikey").
    apiKeyFromSecret: false
    #secretName: "mcp-mesh-secret"    ## default: <release>-mesh-secret if not specified
    secretKey: "apikey"
    #apikey: ""                    ## used if apiKeyFromSecret is false

    
    allowedProjects: "demo"
    allowedSchemas: ""           # leer = alle erlaubt
    allowedLanguages: "de,en"
    readOnly: true
    graphqlMaxDepth: 6
    graphqlTimeoutMs: 5000

  # Protection layers: prevent an LLM from flooding Mesh with requests.
  protection:
    rateLimit:
      globalPerSecond: 50
      perTokenPerSecond: 20
    maxConcurrent: 10
    circuitBreaker:
      enabled: true
      failureRatePercent: 50
      windowSize: 20
      openDurationMs: 30000
    graphqlMaxQueryLength: 4000

  logLevel: "info"

  # Additional environment variables passed through directly.
  extraEnv: []

  service:
    type: ClusterIP
    annotations: {}
    # When transport.mode = "stdio", no Service is created.

  ingress:
    enabled: false
    annotations: {}
    # ingressClassName: nginx
    hosts:
      - host: mesh-mcp.local
        paths:
          - "/"
    tls: []
    #  - secretName: mcp-tls
    #    hosts:
    #      - mesh-mcp.local

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 768Mi

  podSecurityContext:
    runAsUser: null
    fsGroup: null
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}


  startupProbe:
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

