builtInEnvVariables:
  ## Server settings
  - name: MESH_HTTP_ENABLE
    value: "true"

  ## Credentials
  - name: MESH_INITIAL_ADMIN_PASSWORD_FORCE_RESET
    value: "{{ $.Values.credentials.forcePasswordReset }}"
  - name: MESH_INITIAL_ADMIN_PASSWORD
    value: "{{ $.Values.credentials.initialAdminPassword }}"

  ## TODO:
  # MESH_BINARY_UPLOAD_TEMP_DIR
  # MESH_UPDATECHECK
  # MESH_CACHE_PATH_SIZE

  ## Coordinator
  - name: MESH_CLUSTER_COORDINATOR_REGEX
    value: "{{ $.Values.cluster.coordinatorRegex }}"

  ## Common settings
  - name: MESH_UPDATECHECK
    value: "false"

  ## Security
  - name: MESH_HTTP_SERVER_TOKENS
    value: "false"

  ## Database Access
  - name: MESH_DATABASE_ADDRESS
    value: "{{ required "Required configuration database.host is missing!" $.Values.database.host }}:{{ required "Required configuration database.port is missing!" $.Values.database.port }}"
  - name: MESH_JDBC_DATABASE_NAME
    value: "{{ required "Required configuration database.name is missing!" $.Values.database.name }}"
  - name: MESH_JDBC_CONNECTION_USERNAME
    value: "{{ required "Required configuration database.username is missing!" $.Values.database.username }}"
  {{- if $.Values.database.passwordSecret }}
  - name: MESH_JDBC_CONNECTION_PASSWORD
    valueFrom:
      secretKeyRef:
        name: {{ $.Values.database.passwordSecret }}
        key: password
  {{- else if $.Values.database.password }}
  - name: MESH_JDBC_CONNECTION_PASSWORD
    valueFrom:
      secretKeyRef:
        name: {{ template "mesh.fullname" . }}-database
        key: password
  {{- else }}
  - name: MESH_JDBC_CONNECTION_PASSWORD
    value: "{{ required "Either database.password or database.passwordSecret are required!" "" }}"
  {{- end }}
  {{- if $.Values.database.extraParams }}
  - name: MESH_JDBC_CONNECTION_URL_EXTRA_PARAMS
    value: "{{ $.Values.database.extraParams }}"
  {{- end }}

  ## Vert.x Options
  - name: MESH_VERTX_WORKER_POOL_SIZE
    value: "{{ $.Values.vertxOptions.workerPoolSize }}"
  - name: MESH_VERTX_EVENT_POOL_SIZE
    value: "{{ $.Values.vertxOptions.eventLoopSize }}"
  - name: MESH_HTTP_VERTICLE_AMOUNT
    value: "{{ $.Values.vertxOptions.verticleCount }}"
  - name: MESH_VERTX_ORDERED_BLOCKING_HANDLERS
    value: "{{ $.Values.vertxOptions.orderedBlockingHandlers }}"

  ## Paths
  - name: MESH_BINARY_DIR
    value: "/uploads"
  - name: MESH_AUTH_KEYSTORE_PATH
    value: "/keystore/keystore.jceks"
  - name: MESH_PLUGIN_DIR
    value: "/plugins"

  ## Monitoring
  {{- if $.Values.monitoring.enabled }}
  - name: MESH_MONITORING_HTTP_HOST
    value: 0.0.0.0
  - name: MESH_MONITORING_JVM_METRICS_ENABLED
    value: "true"
  - name: MESH_MONITORING_ENABLED
    value: "true"
  {{- end }}

  ## Keystore password
  {{- if $.Values.keystore.passwordSecret }}
  - name: MESH_AUTH_KEYSTORE_PASS
    valueFrom:
      secretKeyRef:
        name: {{ $.Values.keystore.passwordSecret }}
        key: password
  {{- else if $.Values.keystore.password }}
  - name: MESH_AUTH_KEYSTORE_PASS
    valueFrom:
      secretKeyRef:
        name: {{ template "mesh.fullname" . }}-keystore
        key: password
  {{- else }}
  - name: MESH_AUTH_KEYSTORE_PASS
    value: "{{ required "Either keystore.password or keystore.passwordSecret are required!" "" }}"
  {{- end }}

  ## HTTP / SSL
  {{- if $.Values.ssl.enabled }}
  - name: MESH_HTTPS_PORT
    value: "8443"
  - name: MESH_HTTP_SSL_ENABLE
    value: "true"
  - name: MESH_HTTP_SSL_CLIENT_AUTH_MODE
    value: "{{ $.Values.ssl.clientAuthMode }}"
  - name: MESH_HTTP_SSL_CERT_PATH
    value: "{{ $.Values.ssl.serverCertPath }}"
  - name: MESH_HTTP_SSL_KEY_PATH
    value: "{{ $.Values.ssl.serverKeyPath }}"
  {{- if $.Values.ssl.trustedCertPaths }}
  - name: MESH_HTTP_SSL_TRUSTED_CERTS
    value: "{{ $.Values.ssl.trustedCertPaths }}"
  {{- end }}
  {{- end }}

  ## Upload
  - name: MESH_BINARY_UPLOAD_LIMIT
    value: "{{ $.Values.upload.limit }}"

  ## Search
  - name: MESH_ELASTICSEARCH_URL
    value: "{{ $.Values.elasticsearch.url }}"
  - name: MESH_TEMP_DIR
    value: "/tmp"
  {{- if ne $.Values.elasticsearch.url "null" }}
  - name: MESH_ELASTICSEARCH_COMPLIANCE_MODE
    value: "{{ required "elasticsearch.complianceMode is required!" $.Values.elasticsearch.complianceMode }}"
  {{- if $.Values.elasticsearch.prefix }}
  - name: MESH_ELASTICSEARCH_PREFIX
    value: "{{ $.Values.elasticsearch.prefix }}"
  {{- end }}
  {{- end }}

  # MESH_ELASTICSEARCH_CERT_PATH
  # MESH_ELASTICSEARCH_HOSTNAME_VERIFICATION
  # MESH_ELASTICSEARCH_PASSWORD
  # MESH_ELASTICSEARCH_COMPLIANCE_MODE
  # MESH_ELASTICSEARCH_RETRY_LIMIT
  # MESH_ELASTICSEARCH_BULK_LENGTH_LIMIT
  # MESH_ELASTICSEARCH_INCLUDE_BINARY_FIELDS
  # MESH_ELASTICSEARCH_BULK_LIMIT
  # MESH_ELASTICSEARCH_RETRY_INTERVAL
  # MESH_ELASTICSEARCH_USERNAME
  # MESH_ELASTICSEARCH_EVENT_BUFFER_SIZE
  # MESH_ELASTICSEARCH_IDLE_DEBOUNCE_TIME
  # MESH_ELASTICSEARCH_TIMEOUT

  - name: MESH_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name

  ## Clustering
  {{- if eq $.Values.cluster.enabled true }}
  - name: MESH_CLUSTER_ENABLED
    value: "true"
  - name: MESH_CLUSTER_VERTX_PORT
    value: "4848"
  - name: MESH_CLUSTER_NAME
    value: meshcluster
  - name: "hazelcast.kubernetes.service-dns"
    value: {{ template "mesh.fullname" . }}-hazelcast
  {{- end }}

  ## License Key
  {{- if $.Values.license.secret }}
  - name: LICENSEKEY
    valueFrom:
      secretKeyRef:
        name: {{ $.Values.license.secret }}
        key: licensekey
  - name: LICENSEKEY_PATH
    value: "{{ $.Values.license.path }}/{{ $.Values.license.filename }}"
  {{- else if $.Values.license.key }}
  - name: LICENSEKEY
    valueFrom:
      secretKeyRef:
        name: {{ template "mesh.fullname" . }}-secrets
        key: licensekey
  - name: LICENSEKEY_PATH
    value: "{{ $.Values.license.path }}/{{ $.Values.license.filename }}"
  {{- end }}
