replicaCount: 3

image:
  repository: docker.gentics.com/gentics/mesh
  tag: 1.6.21
  pullPolicy: Always

imagePullSecrets: 
  - name: docker-gentics-com

# extraConfig creates a configmap per name, which can hold multiple
# items and can be mountad as a specified path
#extraConfig:
#  - name: myconfig
#    items:
#      - key: custom.yml
#        mountPath: /plugins/myplugin/custom.yml
#        value: |
#          setup:
#            customValue: value

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  #ingressClassName: nginx
  hosts:
    - host: gentics-mesh.apps-crc.testing
      paths:
        - "/"

extraEnv:
- name: JAVA_TOOL_OPTIONS
  value: "-Xms512m -Xmx512m"

# You should adjust this to your needs. This just defines the absolute minimum defaults.
# The memory values should be set in conjunction with the Java Xmx plus other Java memory settings like Direct memory
# See: https://gentics.com/mesh/docs/administration-guide/#_memory_settings
resources:
  requests:
    memory: 1024Mi
    cpu: 500m
  limits:
    memory: 2Gi
    cpu: 500m

persistence:
  enabled: true

  shared:
    #storageClassName: ""
    annotations:
      test: "shared"
    spec:
      accessModes:
        - ReadWriteOnce
        - ReadOnlyMany
      resources:
        requests:
          storage: 10Gi

  # Volume for persisting cached images
  # A volume will be created for each replica of Mesh
  sharedImages:
    enabled: false
    annotations: {}
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: "nfs-nas"
      resources:
        requests:
          storage: 5Gi

database:
  host: "gentics-mesh-mariadb"
  port: 3306
  name: "meshdb"
  username: "meshdbuser"
  password: "supersecret"
  extraParams: ""

keystore:
  password: "secret"

ssl:
  enabled: false
  # Client Authentication mode can be: none, request or require
  # See https://gentics.com/mesh/docs/references/#_client_certificate for details
  clientAuthMode: "REQUEST"
  serverKeyPath: "/certs/server.key"
  serverCertPath: "/certs/server.pem"
  trustedCertPaths: "/certs/server.pem"
  existingSecret: "mesh-ssl-secret"

credentials:
  initialAdminPassword: "YOURPW"
  forcePasswordReset: false

cluster:
  enabled: true

# ── MCP-Server (optional) ────────────────────────────────────────────────────
# Aktiviert die Model-Context-Protocol-Schnittstelle als zusätzlichen Pod.
# Standardmäßig deaktiviert; hier zum Anschalten als HTTP-Service mit Ingress.
mcpServer:
  enabled: true

  image:
    repository: repo.gentics.com/mesh/mcp-server
    # tag: 3.3.0          # default: Chart.AppVersion
    pullPolicy: IfNotPresent
    pullSecret: docker-gentics-com

  transport:
    mode: http
    auth:
      # Generate once: openssl rand -base64 32
      token: "REPLACE-ME-WITH-OPENSSL-RAND-BASE64-32"
      # Oder existierendes Secret mit Key MCP_AUTH_TOKEN nutzen:
      # existingSecret: mcp-auth
    cors:
      origins:
        - https://chat.example.com

  mesh:
    # baseUrl wird default aus dem Mesh-Service desselben Release abgeleitet
    # baseUrl: "http://gentics-mesh:80"
    username: "admin"
    password: "YOURPW"            # in Prod via existingSecret
    # existingSecret: mesh-admin-credentials
    allowedProjects: "demo,corporate"
    allowedLanguages: "de,en"
    readOnly: true

  protection:
    rateLimit:
      globalPerSecond: 50
      perTokenPerSecond: 20
    maxConcurrent: 10
    circuitBreaker:
      enabled: true

  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 1m
    hosts:
      - host: mesh-mcp.apps-crc.testing
        paths:
          - "/"
