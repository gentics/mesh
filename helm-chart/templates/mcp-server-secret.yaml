{{- if .Values.mcpServer.enabled -}}
{{- if include "mesh.mcpServer.useApiKey" . }}
{{- /* API-key mode: the key replaces username + password.
       mesh.apikey set  -> the chart creates secretName/secretKey from the value
       apiKeyFromSecret -> secretName/secretKey are pre-existing (apikey job /
                           umbrella chart), nothing is rendered here */ -}}
{{- if .Values.mcpServer.mesh.apikey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mesh.mcpServer.apiKeySecretName" . }}
  labels:
    {{- include "mesh.mcpServer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "mesh.mcpServer.apiKeySecretKey" . }}: {{ .Values.mcpServer.mesh.apikey | quote }}
{{- end }}
{{- else }}
{{- /* Mesh credentials secret: only rendered when an explicit password is set.
       Without password/existingSecret the MCP server automatically uses the
       release's admin secret (see mesh.mcpServer.meshPasswordRef). */ -}}
{{- if and .Values.mcpServer.mesh.password (not .Values.mcpServer.mesh.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mesh.mcpServer.meshSecretName" . }}
  labels:
    {{- include "mesh.mcpServer.labels" . | nindent 4 }}
type: Opaque
stringData:
  MESH_PASSWORD: {{ .Values.mcpServer.mesh.password | quote }}
{{- end }}
{{- end }}
{{- if and (eq .Values.mcpServer.transport.mode "http") (not .Values.mcpServer.transport.auth.disabled) (not .Values.mcpServer.transport.auth.existingSecret) }}
{{- /* Bearer token: explicit value wins; otherwise generated once and reused
       across upgrades (lookup). For GitOps/Argo CD use
       transport.auth.existingSecret (see README). */ -}}
{{- $secretName := printf "%s-auth" (include "mesh.mcpServer.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $token := .Values.mcpServer.transport.auth.token | default "" }}
{{- if not $token }}
{{- if $existing }}
{{- $token = index $existing.data "MCP_AUTH_TOKEN" | default "" | b64dec }}
{{- end }}
{{- end }}
{{- if not $token }}
{{- $token = randAlphaNum 32 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "mesh.mcpServer.labels" . | nindent 4 }}
type: Opaque
stringData:
  MCP_AUTH_TOKEN: {{ $token | quote }}
{{- end }}
{{- end }}
