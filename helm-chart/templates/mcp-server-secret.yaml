{{- if .Values.mcpServer.enabled -}}
{{- if not .Values.mcpServer.mesh.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mesh.mcpServer.meshSecretName" . }}
  labels:
    {{- include "mesh.mcpServer.labels" . | nindent 4 }}
type: Opaque
stringData:
  MESH_USERNAME: {{ required "mcpServer.mesh.username muss gesetzt sein" .Values.mcpServer.mesh.username | quote }}
  MESH_PASSWORD: {{ required "mcpServer.mesh.password oder mcpServer.mesh.existingSecret muss gesetzt sein" .Values.mcpServer.mesh.password | quote }}
{{- end }}
{{- if and (eq .Values.mcpServer.transport.mode "http") (not .Values.mcpServer.transport.auth.disabled) (not .Values.mcpServer.transport.auth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-auth" (include "mesh.mcpServer.fullname" .) }}
  labels:
    {{- include "mesh.mcpServer.labels" . | nindent 4 }}
type: Opaque
stringData:
  MCP_AUTH_TOKEN: {{ required "mcpServer.transport.auth.token oder mcpServer.transport.auth.existingSecret muss gesetzt sein, wenn transport.mode=http und auth.disabled=false." .Values.mcpServer.transport.auth.token | quote }}
{{- end }}
{{- end }}
