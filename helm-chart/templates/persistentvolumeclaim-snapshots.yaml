{{- if and (not .Values.persistence.backup.snapshots.existingClaim) .Values.backup.enabled}}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ include "mesh.fullname" . }}-snapshots

  labels:
    {{- include "mesh.labels" . | nindent 4 }}

  {{- with .Values.persistence.backup.snapshots.annotations }}
  annotations:
    {{ toYaml . }}
  {{- end }}

spec:
  {{- toYaml .Values.persistence.backup.snapshots.spec | nindent 2 }}
{{- end }}
