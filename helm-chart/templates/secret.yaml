{{- if and $.Values.database.password (not $.Values.database.passwordSecret) }}
---
apiVersion: v1
data:
  password: {{ .Values.database.password | b64enc | quote }}
kind: Secret
metadata:
  name: {{ template "mesh.fullname" . }}-database
type: Opaque
{{- end }}
{{- if and $.Values.keystore.password (not $.Values.keystore.passwordSecret) }}
---
apiVersion: v1
data:
  password: {{ .Values.keystore.password | b64enc | quote }}
kind: Secret
metadata:
  name: {{ template "mesh.fullname" . }}-keystore
type: Opaque
{{- end }}
{{- if and $.Values.license.key (not $.Values.license.secret) }}
---
apiVersion: v1
data:
  licensekey: {{ $.Values.license.key | b64enc | quote }}
kind: Secret
metadata:
  name: {{ template "mesh.fullname" . }}-secrets
type: Opaque
{{- end }}
