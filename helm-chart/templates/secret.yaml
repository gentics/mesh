apiVersion: v1
data:
  password: {{ .Values.keystore.password | b64enc | quote }}
kind: Secret
metadata:
  name: {{ template "mesh.fullname" . }}-keystore
type: Opaque
---
apiVersion: v1
data:
  licensekey: "{{- if .Values.licenseKey -}}{{ .Values.licenseKey | b64enc }}{{- end }}"
kind: Secret
metadata:
  name: {{ template "mesh.fullname" . }}-secrets
type: Opaque
