{{- if not .Values.initialAdminPassword.existingSecret }}
{{- $secretName := printf "%s-admin" (include "mesh.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := .Values.initialAdminPassword.password | default "" }}
{{- if not $password }}
  {{- if $existing }}
    {{- $password = index $existing.data "password" | default "" | b64dec }}
  {{- else }}
    {{- $password = randAlphaNum 24 }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
{{- $db := $.Values.database | default dict -}}
{{- $globalMariadb := (($.Values.global | default dict).mariadb) | default dict -}}
{{- $globalLicense := (($.Values.global | default dict).license) | default dict -}}
{{- if and $db.password (not $db.passwordSecret) (not $globalMariadb.enabled) }}
---
apiVersion: v1
data:
  password: {{ $db.password | b64enc | quote }}
kind: Secret
metadata:
  name: {{ template "mesh.fullname" . }}-database
type: Opaque
{{- end }}
{{- if and $.Values.keystore.password (not $.Values.keystore.passwordSecret) }}
---
apiVersion: v1
data:
  password: {{ .Values.keystore.password | b64enc | quote }}
kind: Secret
metadata:
  name: {{ template "mesh.fullname" . }}-keystore
type: Opaque
{{- end }}
{{- if and $.Values.license.key (not $.Values.license.secret) (not $globalLicense.key) }}
---
apiVersion: v1
data:
  licensekey: {{ $.Values.license.key | b64enc | quote }}
kind: Secret
metadata:
  name: {{ template "mesh.fullname" . }}-secrets
type: Opaque
{{- end }}
